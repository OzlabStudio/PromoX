<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optativa de Tecnología - Portal Académico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandDark: '#0f172a', brandCard: '#1e293b', brandAccent: '#8b5cf6', brandCyan: '#06b6d4' }
        }
      }
    }
  </script>
</head>
<body class="bg-brandDark text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-5xl bg-brandCard rounded-2xl shadow-2xl border border-slate-800 p-6 md:p-8">

    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-violet-600 to-cyan-500 mb-4 shadow-lg">
        <i class="fa-solid fa-laptop-code text-2xl text-white"></i>
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">Optativa de Tecnología</h1>
      <p class="text-sm text-slate-400 mt-1">Plataforma Integral de Gestión y Progreso Académico</p>
    </header>

    <!-- ================= 1. VISTA LOGIN ================= -->
    <section id="view-login" class="space-y-6 max-w-md mx-auto">
      <div class="bg-slate-900/60 p-6 rounded-xl border border-slate-800 text-center">
        <h2 class="text-lg font-semibold mb-2 text-violet-400">Acceso al Sistema</h2>
        <p class="text-xs text-slate-400 mb-6">Ingresa tu PIN personal o maestro. (Usa 0000 para configurar tu PIN inicial)</p>
        
        <form id="form-login" onsubmit="event.preventDefault(); loginEstudiante();" class="space-y-4">
          <input type="password" id="input-pin" maxlength="4" placeholder="••••" required pattern="[0-9]{4}" inputmode="numeric"
                 class="w-full text-center text-3xl font-mono tracking-widest bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-cyan-400 focus:outline-none focus:border-violet-500">
          <button type="submit" id="btn-login"
                  class="w-full bg-gradient-to-r from-violet-600 to-cyan-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:opacity-95 transition-all flex items-center justify-center gap-2">
            <span>Ingresar</span><i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
        <p id="login-error" class="text-rose-400 text-xs mt-3 hidden"></p>
      </div>
    </section>

    <!-- ================= 2. CONFIGURACIÓN PIN 0000 ================= -->
    <section id="view-setup-pin" class="hidden space-y-6 max-w-md mx-auto">
      <div class="bg-slate-900/60 p-6 rounded-xl border border-slate-800 text-center">
        <h2 class="text-lg font-semibold mb-2 text-cyan-400">Primer Acceso</h2>
        <form id="form-setup-pin" onsubmit="event.preventDefault(); guardarNuevoPin();" class="space-y-4 text-left">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Selecciona tu Nombre</label>
            <select id="select-estudiante-setup" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
              <option value="">Cargando...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Nuevo PIN (4 dígitos)</label>
            <input type="password" id="input-new-pin" maxlength="4" placeholder="••••" required pattern="[0-9]{4}" inputmode="numeric"
                   class="w-full text-center text-2xl font-mono tracking-widest bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-cyan-400">
          </div>
          <button type="submit" id="btn-save-pin" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg">Guardar PIN</button>
        </form>
        <p id="setup-msg" class="text-xs mt-2 hidden"></p>
      </div>
    </section>

    <!-- ================= 3. PANEL DEL ESTUDIANTE ================= -->
    <section id="view-dashboard" class="hidden space-y-6">
      
      <!-- HEADER ESTUDIANTE -->
      <div class="flex items-center justify-between bg-slate-900/80 p-4 rounded-xl border border-slate-800">
        <div>
          <span class="text-xs text-slate-400">Estudiante Activo</span>
          <h2 id="student-name" class="text-xl md:text-2xl font-bold text-cyan-400">Cargando...</h2>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-400 uppercase tracking-wider font-bold">Calificación Total</span>
          <h2 id="student-score" class="text-xl md:text-2xl font-black text-emerald-400">0 / 20 pts</h2>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- ZONA DE CARGA (COLUMNA IZQUIERDA) -->
        <div class="lg:col-span-1 bg-slate-900/60 p-5 rounded-xl border border-slate-800 space-y-4 h-fit">
          <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> Cargar Entregable
          </h3>
          <form id="form-entrega" onsubmit="event.preventDefault(); enviarEntregaNueva();" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Actividad a Entregar</label>
              <select id="select-actividad-carga" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                <option value="">Cargando...</option>
              </select>
            </div>
            
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Modalidad de Entrega</label>
              <select id="select-modalidad" onchange="toggleParejaSelect()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                <option value="individual">Individual</option>
                <option value="pareja">En Pareja</option>
              </select>
            </div>

            <div id="container-pareja" class="hidden space-y-1">
              <label class="block text-xs font-medium text-slate-300 mb-1">Compañero/a</label>
              <select id="select-pareja" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                <option value="">Selecciona un compañero/a...</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Enlace del Proyecto (Drive, Canva...)</label>
              <input type="url" id
